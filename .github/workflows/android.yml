
name: Build GBENGA Free and Pro APKs

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Free and Pro release APKs
        run: >
          gradle --no-daemon
          :app:assembleFreeRelease
          :app:assembleProRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GBENGA-APKs
          path: |
            app/build/outputs/apk/free/release/*.apk
            app/build/outputs/apk/pro/release/*.apk
          if-no-files-found: error
          retention-days: 30
